name: ClubFa Ultimate - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compilar ClubFa Ultimate
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extrair projeto ClubFa
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            -iname "ClubFa*.zip" | sort | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP do ClubFa nao encontrado"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: Projeto Android nao encontrado"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Corrigir propriedade fillViewport
        shell: bash
        run: |
          find "$PROJECT_DIR" -type f -name "*.kt" \
            -exec sed -i \
            's/\bfillViewport[[:space:]]*=/isFillViewport =/g' {} +

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Preparar APK
        shell: bash
        run: |
          mkdir -p apk-final

          find "$PROJECT_DIR" -type f \
            -name "*.apk" \
            -exec cp {} apk-final/ \;

          test -n "$(find apk-final -name '*.apk' -print -quit)"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ClubFa-Ultimate-APK
          path: apk-final/*.apk
          if-no-files-found: error
