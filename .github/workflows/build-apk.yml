
name: Nosso Canto - Links e Logo Dourada

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'NossoCanto-Android-Links-Logo-Dourada.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          set -euo pipefail
          unzip -q NossoCanto-Android-Links-Logo-Dourada.zip -d extracted
          test -f extracted/NossoCanto-Android-Links-Logo-Dourada/settings.gradle.kts

      - name: Compilar APK
        run: |
          gradle --no-daemon \
            -p extracted/NossoCanto-Android-Links-Logo-Dourada \
            :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nosso-Canto-APK-Dourado
          path: extracted/NossoCanto-Android-Links-Logo-Dourada/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
