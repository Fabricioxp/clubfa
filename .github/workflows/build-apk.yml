name: Gerar APK ClubFa

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "Android SDK: $ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms"

      - name: Instalar componentes Android
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair ClubFa
        run: |
          unzip -q ClubFa-GitHub-Android.zip

      - name: Compilar APK
        working-directory: ClubFa-Android
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ClubFa-APK
          path: ClubFa-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
