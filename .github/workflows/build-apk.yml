
name: Nosso Canto - Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NossoCanto-Android.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar componentes Android
        run: |
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'platform-tools'

      - name: Extrair aplicativo
        run: |
          unzip -q NossoCanto-Android.zip -d extracted
          test -f extracted/NossoCanto-Android/settings.gradle.kts

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        run: |
          gradle --no-daemon \
            -p extracted/NossoCanto-Android \
            :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nosso-Canto-APK
          path: extracted/NossoCanto-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
