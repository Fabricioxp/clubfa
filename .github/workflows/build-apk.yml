
name: ClubFa Ultimate 260 - Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'ClubFa-Ultimate-260-Local.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto correto
        shell: bash
        run: |
          set -euo pipefail

          test -f ClubFa-Ultimate-260-Local.zip || {
            echo "Envie ClubFa-Ultimate-260-Local.zip para a raiz do repositorio"
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/clubfa"

          unzip -q ClubFa-Ultimate-260-Local.zip \
            -d "$RUNNER_TEMP/clubfa"

          test -f "$RUNNER_TEMP/clubfa/ClubFa-Android/settings.gradle.kts"

          echo "PROJECT_DIR=$RUNNER_TEMP/clubfa/ClubFa-Android" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ClubFa-Ultimate-260-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
