
name: Nosso Canto - APK Navegacao Corrigida

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'NossoCanto-Android-Navegacao-Corrigida.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar componentes Android
        run: |
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        shell: bash
        run: |
          set -euo pipefail

          test -f NossoCanto-Android-Navegacao-Corrigida.zip

          mkdir -p extracted

          unzip -q NossoCanto-Android-Navegacao-Corrigida.zip \
            -d extracted

          test -f \
            extracted/NossoCanto-Android-Navegacao-Corrigida/settings.gradle.kts

      - name: Compilar APK
        run: |
          gradle --no-daemon \
            -p extracted/NossoCanto-Android-Navegacao-Corrigida \
            :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nosso-Canto-APK-Corrigido
          path: extracted/NossoCanto-Android-Navegacao-Corrigida/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
